name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    name: Server - test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Lint
        working-directory: server
        run: npm run lint

      - name: Run tests
        working-directory: server
        run: npm test

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: short-video-frontend/package-lock.json

      - name: Install dependencies
        working-directory: short-video-frontend
        run: npm ci

      - name: Build
        working-directory: short-video-frontend
        run: npm run build
        env:
          CI: false
